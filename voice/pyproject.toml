[project]
name = "kitflo-voice"
version = "1.3.0"
description = "Kitflo's local voice cloning, text-to-speech and audio enhancement sidecar"
requires-python = "==3.11.*"
dependencies = [
    "omnivoice==0.2.1",
    "num2words",
    "deepfilternet>=0.5.6",
    "speechbrain>=1.0",
    "pyloudnorm>=0.1.1",
    "soundfile",
    "numpy",
    "peft==0.21.2",  # Pro training (LoRA); the version proven with these pins
    # Pinned: torch 2.14 + transformers 5.20 segfaults loading OmniVoice on MPS.
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==5.15.1",
]
