<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OpenFlo icon, Harshkit family: graphite tile, silver voice waveform with a glowing core, AI spark. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glowbg" cx=".5" cy=".52" r=".5">
      <stop offset="0" stop-color="#5e5ce6" stop-opacity=".34"/>
      <stop offset=".6" stop-color="#2997ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e5e5ea"/>
      <stop offset="1" stop-color="#a1a1a6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset=".5" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-40%" width="260%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="sparkglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
    <path id="sparkle" d="M0,-1 C0.12,-0.12 0.12,-0.12 1,0 C0.12,0.12 0.12,0.12 0,1 C-0.12,0.12 -0.12,0.12 -1,0 C-0.12,-0.12 -0.12,-0.12 0,-1 Z"/>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowbg)"/>

    <!-- glow behind the core bars -->
    <rect x="392" y="300" width="240" height="424" rx="120" fill="url(#core)" opacity=".75" filter="url(#blur)"/>

    <!-- waveform: 7 bars, 64 wide, 36 apart, centred on 512 -->
    <rect x="164" y="442" width="64" height="140" rx="32" fill="url(#metal)"/>
    <rect x="264" y="362" width="64" height="300" rx="32" fill="url(#metal)"/>
    <rect x="364" y="292" width="64" height="440" rx="32" fill="url(#metal)"/>
    <rect x="464" y="232" width="96" height="560" rx="48" fill="url(#core)"/>
    <rect x="464" y="232" width="96" height="150" rx="48" fill="#fff" opacity=".12"/>
    <rect x="596" y="292" width="64" height="440" rx="32" fill="url(#metal)"/>
    <rect x="696" y="362" width="64" height="300" rx="32" fill="url(#metal)"/>
    <rect x="796" y="442" width="64" height="140" rx="32" fill="url(#metal)"/>

    <!-- AI spark -->
    <use href="#sparkle" transform="translate(818 210) scale(100)" fill="url(#spark)" filter="url(#sparkglow)" opacity=".9"/>
    <use href="#sparkle" transform="translate(818 210) scale(86)" fill="url(#spark)"/>
    <use href="#sparkle" transform="translate(818 210) scale(28)" fill="#fff" opacity=".85"/>
    <use href="#sparkle" transform="translate(890 318) scale(32)" fill="url(#spark)" opacity=".95"/>

    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <rect x="1.5" y="1.5" width="1021" height="1021" rx="226.5" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="3"/>
  </g>
</svg>
